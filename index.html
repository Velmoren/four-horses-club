<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js"></script>
    <title>Four Horses Club</title>
</head>

<body>
    <main>
        <section class="hero">
            <header>
                <div class="container">
                    <div class="logo">
                        <img class="logo-icon" src="./images/logo.svg" alt="logo">
                        <span class="logo-text">Клуб<br>четырех коней</span>
                    </div>
                </div>
            </header>

            <div class="container">
                <div class="hero-content">
                    <h1 class="hero__title">
                        <span>Превратите уездный город</span>
                        <span>в столицу</span>
                        <span>земного шара</span>
                    </h1>

                    <p class="hero__subtitle">
                        Оплатите взнос на телеграммы для организации Международного васюкинского турнира по шахматам
                    </p>

                    <div class="hero__controls">
                        <button class="btn btn-primary">Поддержать шахматную мысль</button>
                        <button class="btn btn-outline">Подробнее о турнире</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
